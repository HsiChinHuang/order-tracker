apiVersion: 1

datasources:
  # Explicit uids: the dashboard JSON references these, and provisioned
  # datasources otherwise get a generated uid the JSON cannot predict.
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
    isDefault: true

  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: Tempo
    uid: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # Turns the trace_id carried on each log record into a clickable link into
      # Tempo. matcherRegex runs over the log line and its structured metadata, so
      # trace_id does not have to be a stream label for this to work.
      tracesToLogsV2:
        datasourceUid: Loki
      tracesToMetrics:
        datasourceUid: Prometheus
      serviceMap:
        datasourceUid: Prometheus
      nodeGraph:
        enabled: true
