apiVersion: 1

# Grafana 11 file provisioning keys are `contactPoints`, `policies` and
# `groups`. The legacy `notifiers:` / `notification_policies:` schema from the
# alerting-providers docs is not read here, so a file using it provisions
# nothing at all and leaves the default email receiver in place.

contactPoints:
  - orgId: 1
    name: webhook-notifier
    receivers:
      - uid: webhook_alert
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://responder:8001/alerts
          httpMethod: POST
          maxAlerts: "0"
