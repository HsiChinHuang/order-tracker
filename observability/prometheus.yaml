global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The collector publishes the app's OTLP metrics on :8889. The app itself
  # serves no /metrics endpoint, so scraping app:8000 only produced a target
  # stuck in DOWN.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
