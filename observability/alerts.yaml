apiVersion: 1

groups:
  - name: order-tracker-alerts
    folder: order-tracker
    rules:
      - alert: High5xxErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate detected on {{ $labels.http_route }}"
          description: "The ratio of 5xx errors to total requests is above 10% for more than 1 minute on route {{ $labels.http_route }}."
          dashboard_url: "http://grafana:3000/d/order-tracker-dashboard/order-tracker-dashboard?var-environment={{ $labels.environment }}"
          endpoint: "{{ $labels.http_route }}"
          time_window: "5m rate / 1m for"
          owner: "oncall-engineer"
