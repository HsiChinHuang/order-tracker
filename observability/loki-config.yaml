auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# The Collector pushes logs over OTLP at /otlp/v1/logs on the HTTP port.
#
# Structured metadata must stay enabled or Loki rejects the OTLP payload as
# malformed.
#
# Cardinality was suspected to be unbounded because a query_range response shows
# 17 keys under "stream", including trace_id, span_id and observed_timestamp --
# which would mean one stream per request. That turned out to be a misreading of
# the response shape, not a real problem. Measured on the live ingester over 24h:
#   /loki/api/v1/labels          -> [service_name, service_instance_id] only
#   /loki/api/v1/index/stats     -> 6 streams for 83 entries (13.8 lines/stream)
#   {service_name=..., trace_id!=""} -> 0 lines; without that matcher -> 50
# So per-request attributes are structured metadata, NOT index labels, exactly as
# intended. Consequence to remember: they cannot be used in a LogQL label
# selector; filter them as line filters instead, e.g.
#   {service_name="order-tracker"} | json | http_response_status_code="500"
# which returns 31 lines. Do not add a limits_config.structured_metadata key:
# Loki 3.3 rejects it ("field ... not found in type validation.plain").
limits_config:
  allow_structured_metadata: true
  retention_period: 24h
ingester:
  wal:
    enabled: true
    dir: /loki/wal

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
