auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# The Collector pushes logs over OTLP at /otlp/v1/logs on the HTTP port.
# Resource attributes (service_name etc.) only become Loki labels when
# structured metadata is allowed.
limits_config:
  allow_structured_metadata: true
  retention_period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/wal

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
